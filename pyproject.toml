[project]
name = "kuda-segodnya"
version = "0.1.0"
description = "Telegram-бот с бесплатными событиями Москвы для студентов"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.14,<4",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "selectolax>=0.3.25",
    "apscheduler>=3.10",
    "python-dateutil>=2.9",
    "orjson>=3.10",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
